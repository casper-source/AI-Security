version: "3.9"

services:
  # Chatbot web application (talks to custom Ollama URL)
  chatbot:
    build: .
    container_name: nlt_chatbot_custom
    restart: unless-stopped
    network_mode: host  # Use host networking to access custom Ollama URL
    environment:
      # Custom Ollama URL (will be replaced by launch script)
      - OLLAMA_BASE_URL=REPLACE_WITH_CUSTOM_OLLAMA_URL
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - DATABASE_PATH=/app/data/nlt_customer_service.db
      - TRANSFORMERS_CACHE=/app/data/transformers_cache
      - HF_HOME=/app/data/huggingface_cache
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_TELEMETRY_ENABLED=false
      - CHROMADB_TELEMETRY_DISABLED=true
      - POSTHOG_DISABLED=true
      # AI Security Teaching Level (1-5)
      - AI_SECURITY_LEVEL=${AI_SECURITY_LEVEL:-1}
      # Optional: tighten app-side timeouts if your client supports them
      # - OLLAMA_TIMEOUT_SECONDS=90
    volumes:
      - chatbot_data:/app/data
      - vector_db_data:/app/data/vector_db
      - ./templates:/app/templates
      - ./static:/app/static
      - ./app.py:/app/app.py
      - ./scripts:/app/scripts
      - ./knowledge_base:/app/knowledge_base
      - ./.selected_model:/app/.selected_model
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  chatbot_data:
  vector_db_data:
