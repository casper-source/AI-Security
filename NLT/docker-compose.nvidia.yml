# Docker Compose for NVIDIA GPU support

services:
  # Ollama service with NVIDIA GPU support
  ollama:
    image: ollama/ollama:latest
    container_name: nlt_ollama_nvidia
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ollama_network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Chatbot web application
  chatbot:
    build: .
    container_name: nlt_chatbot
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - chatbot_data:/app/data
      - ./.selected_model:/app/.selected_model
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/nlt_customer_service.db
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_TELEMETRY_ENABLED=false
      - CHROMADB_TELEMETRY_DISABLED=true
      - POSTHOG_DISABLED=true
      # AI Security Teaching Level (1-5)
      - AI_SECURITY_LEVEL=${AI_SECURITY_LEVEL:-1}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ollama_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ollama_network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  chatbot_data:
    driver: local
