# Alternative Docker Compose for AMD ROCm GPU support
# Note: This is experimental and may require additional ROCm setup

services:
  # Ollama service with ROCm support (experimental)
  ollama:
    image: ollama/ollama:rocm
    container_name: nlt_ollama_amd
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      - OLLAMA_HOST=0.0.0.0
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - HIP_VISIBLE_DEVICES=0
      - ROCM_PATH=/opt/rocm
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - GPU_MAX_ALLOC_PERCENT=95
      - GPU_SINGLE_ALLOC_PERCENT=95
      - GPU_MAX_HEAP_SIZE=95G
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "44"    # video group
      - "992"   # render group
    security_opt:
      - seccomp:unconfined
    mem_limit: 96g
    memswap_limit: 96g
    shm_size: 32g
    networks:
      - ollama_network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Chatbot web application
  chatbot:
    build: .
    container_name: nlt_chatbot
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - chatbot_data:/app/data
      - ./.selected_model:/app/.selected_model
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - FLASK_ENV=production
      - DATABASE_PATH=/app/data/nlt_customer_service.db
      - ANONYMIZED_TELEMETRY=False
      - CHROMA_TELEMETRY_ENABLED=false
      - CHROMADB_TELEMETRY_DISABLED=true
      - POSTHOG_DISABLED=true
      # AI Security Teaching Level (1-5)
      - AI_SECURITY_LEVEL=${AI_SECURITY_LEVEL:-1}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ollama_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ollama_network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  chatbot_data:
    driver: local
